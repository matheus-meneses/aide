name: "Build embedded frontend"
description: "Install deps and build the aide UI into frontend/dist so go:embed has assets"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: cli/internal/ui/webui/frontend/package-lock.json
    - shell: bash
      working-directory: cli/internal/ui/webui/frontend
      run: npm ci && npm run build
